name: Work Engine Scheduler

on:
  schedule:
    # Every 30 minutes (UTC). Backend owns batching and overlap safety.
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: work-engine-scheduler
  cancel-in-progress: false

jobs:
  run-scheduler:
    name: Trigger Work Engine scheduler
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Validate cron secret is configured
        env:
          WORK_ENGINE_CRON_SECRET: ${{ secrets.WORK_ENGINE_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${WORK_ENGINE_CRON_SECRET:-}" ]; then
            echo "::error::Repository secret WORK_ENGINE_CRON_SECRET is not set. See docs/work-engine-github-actions-scheduler.md"
            exit 1
          fi

      - name: Probe health then call scheduler once
        env:
          WORK_ENGINE_CRON_SECRET: ${{ secrets.WORK_ENGINE_CRON_SECRET }}
          HEALTH_URL: https://nodexpro.onrender.com/api/v1/health
          SCHEDULER_URL: https://nodexpro.onrender.com/api/v1/work-engine/internal/scheduler/run
          REQUEST_BODY: '{"batch_size":25,"max_work_items_per_run":50}'
        run: |
          set -euo pipefail

          print_safe_summary() {
            local response_file="$1"
            if ! command -v jq >/dev/null 2>&1; then
              echo "Summary: response received (install jq on runner for field breakdown)"
              return 0
            fi
            if ! jq -e . >/dev/null 2>&1 <"$response_file"; then
              echo "Summary: non-JSON response body"
              return 0
            fi
            jq -c '{
              ok: (.ok // false),
              skipped: (.skipped // false),
              skipped_reason: (.result.skipped_reason // .skipped_reason // null),
              scanned_work_items: (.scanned_work_items // 0),
              recomputed_sla: (.recomputed_sla // 0),
              reminders_created: (.reminders_created // 0),
              escalations_created: (.escalations_created // 0),
              snoozed_woken: (.snoozed_woken // 0),
              error_count: ((.errors // []) | length)
            }' "$response_file"
          }

          log_curl_timings() {
            local label="$1"
            local http_code="$2"
            local time_connect="$3"
            local time_starttransfer="$4"
            local time_total="$5"
            local curl_exit="$6"
            echo "${label} HTTP status: ${http_code}"
            echo "${label} connect time: ${time_connect}s"
            echo "${label} time to first byte: ${time_starttransfer}s"
            echo "${label} total duration: ${time_total}s"
            echo "${label} curl exit: ${curl_exit}"
          }

          curl_timed() {
            local method="$1"
            local url="$2"
            local max_time="$3"
            local response_file="$4"
            local extra_args=("${@:5}")
            local metrics_file
            metrics_file="$(mktemp)"
            set +e
            curl -sS \
              --max-time "$max_time" \
              --retry 0 \
              -o "$response_file" \
              -w '%{http_code}\t%{time_connect}\t%{time_starttransfer}\t%{time_total}' \
              -X "$method" "$url" \
              "${extra_args[@]}" \
              >"$metrics_file"
            local curl_exit=$?
            set -e
            local metrics
            metrics="$(tr -d '\r' <"$metrics_file" || true)"
            rm -f "$metrics_file"
            CURL_HTTP_CODE="$(printf '%s' "$metrics" | cut -f1)"
            CURL_TIME_CONNECT="$(printf '%s' "$metrics" | cut -f2)"
            CURL_TIME_STARTRANSFER="$(printf '%s' "$metrics" | cut -f3)"
            CURL_TIME_TOTAL="$(printf '%s' "$metrics" | cut -f4)"
            CURL_EXIT="$curl_exit"
            if [ -z "${CURL_HTTP_CODE:-}" ]; then
              CURL_HTTP_CODE="000"
            fi
          }

          echo "Probing GET /api/v1/health before scheduler POST"
          health_file="$(mktemp)"
          trap 'rm -f "$health_file"' EXIT
          health_ok=0
          for attempt in 1 2 3; do
            curl_timed GET "$HEALTH_URL" 20 "$health_file"
            log_curl_timings "Health attempt ${attempt}/3" "$CURL_HTTP_CODE" "$CURL_TIME_CONNECT" "$CURL_TIME_STARTRANSFER" "$CURL_TIME_TOTAL" "$CURL_EXIT"
            if [ "$CURL_EXIT" -eq 0 ] && [ "$CURL_HTTP_CODE" = "200" ]; then
              health_ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Health probe not ready — retrying in 10 seconds..."
              sleep 10
            fi
          done
          if [ "$health_ok" -ne 1 ]; then
            echo "::error::API health probe failed after 3 attempts. Scheduler POST was not sent."
            exit 1
          fi

          echo "Sending a single scheduler POST (timeout 360s, no retry)"
          response_file="$(mktemp)"
          trap 'rm -f "$health_file" "$response_file"' EXIT
          curl_timed POST "$SCHEDULER_URL" 360 "$response_file" \
            -H "Content-Type: application/json" \
            -H "X-Internal-Cron-Secret: ${WORK_ENGINE_CRON_SECRET}" \
            -d "$REQUEST_BODY"
          log_curl_timings "Scheduler POST" "$CURL_HTTP_CODE" "$CURL_TIME_CONNECT" "$CURL_TIME_STARTRANSFER" "$CURL_TIME_TOTAL" "$CURL_EXIT"
          print_safe_summary "$response_file" || true

          if [ "$CURL_EXIT" -eq 28 ]; then
            echo "::error::Scheduler POST timed out (curl exit 28). Not retrying — result is uncertain; a second POST would risk duplicate side effects."
            exit 1
          fi
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::Scheduler POST failed with curl exit ${CURL_EXIT}. Not retrying uncertain result."
            exit 1
          fi
          if [ "$CURL_HTTP_CODE" = "000" ] || [ -z "$CURL_HTTP_CODE" ]; then
            echo "::error::Scheduler POST returned no HTTP status. Not retrying uncertain result."
            exit 1
          fi
          if [ "$CURL_HTTP_CODE" -ge 200 ] && [ "$CURL_HTTP_CODE" -lt 300 ]; then
            if command -v jq >/dev/null 2>&1 && jq -e '.ok == false' >/dev/null 2>&1 <"$response_file"; then
              echo "::error::Scheduler returned ok=false"
              exit 1
            fi
            echo "Work Engine scheduler completed successfully."
            exit 0
          fi
          echo "::error::Scheduler request failed with HTTP ${CURL_HTTP_CODE}. Not retrying POST."
          exit 1
